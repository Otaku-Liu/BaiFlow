plugins {
    id 'com.android.application'
}

android {
    namespace 'com.baiflow.android'
    compileSdk 34

    defaultConfig {
        applicationId "com.baiflow.android"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    // 服务器地址按构建类型固定（不再手动配置），从本地 local.properties 读取：
    // BAIFLOW_RELEASE_SERVER_URL（release 打包连线上）/ BAIFLOW_DEBUG_SERVER_URL（debug 调试）。
    // local.properties 被 git 忽略（真实地址不提交），模板见 ../local.properties.example；
    // 未配置时回落下列占位默认值。换后端 = 改本地 local.properties 重新打包。
    def serverProps = new Properties()
    def localPropsFile = rootProject.file('local.properties')
    if (localPropsFile.exists()) {
        localPropsFile.withInputStream { serverProps.load(it) }
    }
    def debugServerUrl = serverProps.getProperty('BAIFLOW_DEBUG_SERVER_URL', 'http://10.0.2.2:8080')
    def releaseServerUrl = serverProps.getProperty('BAIFLOW_RELEASE_SERVER_URL', 'http://YOUR_SERVER_HOST:PORT')

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            buildConfigField "String", "SERVER_URL", "\"${debugServerUrl}\""
        }
        release {
            buildConfigField "String", "SERVER_URL", "\"${releaseServerUrl}\""
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            // Robolectric 单元测试需要资源
            includeAndroidResources = true
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.google.android.material:material:1.11.0'

    // Networking
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // WorkManager for background transfers
    implementation 'androidx.work:work-runtime:2.9.0'

    // Room 本地存储（离线模式随手记缓存）
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // Gson
    implementation 'com.google.code.gson:gson:2.10.1'

    // Markdown 渲染（Markwon）
    implementation 'io.noties.markwon:core:4.6.2'
    // Markdown 删除线（~~text~~）渲染
    implementation 'io.noties.markwon:ext-strikethrough:4.6.2'

    // Media3 ExoPlayer（应用内播放器：视频/音频预览，正确处理旋转/比例/时长）
    // 版本与 compileSdk 34 兼容（1.4.x 编译目标 API 34；1.5+ 需 compileSdk 35/36）
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'

    // 单元测试（纯 JVM：MarkdownParser/Emitter 往返测试；适配层用 Robolectric）
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'androidx.test:core:1.5.0'
}
