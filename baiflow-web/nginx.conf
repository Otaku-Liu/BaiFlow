# BaiFlow Web — 容器版 Nginx（配合 deploy/docker-compose.yml 使用）
# host 网络模式：Nginx 直接监听宿主机 8088，/api 反代到宿主机 8080 的 Spring Boot。
server {
    listen 8088;
    server_name _;

    client_max_body_size 2048m;

    # 前端静态资源（Vite build 产物）
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代到 Spring Boot（host 网络，server 容器监听宿主机 8080）
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Range 请求透传（视频 seek / PDF 部分加载 / 图片预览）
        proxy_set_header Range $http_range;

        # 关闭缓冲（大文件流式传输）
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        gzip off;
    }

    # 头像（与 server 容器共享同一挂载目录，Nginx 直接 serve）
    location /avatars/ {
        alias /data/baiflow/avatars/;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }
}
