# BaiFlow 部署 —— 仅管理 server + web 两个容器（镜像从 GHCR 拉取，服务器上不编译）。
# MySQL/Redis 用服务器上已有的容器，经 host 网络直连（不重建、不动数据、不随 compose 重启）。
#
# 用法（生产）：
#   cd deploy
#   cp .env.example .env            # 填入 MySQL/Redis 连接信息与管理员密码
#   docker compose pull             # 拉取 .env 中 BAIFLOW_IMAGE_TAG 指定的版本
#   docker compose up -d            # 启动
#   docker compose restart          # 重启 server + web（MySQL/Redis 各自独立管理，不用管）
#
#   镜像版本由 .env 的 BAIFLOW_IMAGE_TAG 决定（默认 latest）；回滚 = 改成旧版本号再 pull。
#   推 v* tag 时 GitHub Actions 会自动更新该值并重启（见 .github/workflows/release.yml）。
#
# 用法（本地从源码构建，不拉镜像）：
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# 说明：
#   - host 网络模式：server 监听宿主机 8080，web(Nginx) 监听宿主机 8088，
#     server 通过 127.0.0.1 连现有 MySQL/Redis。
#   - 数据目录（文件/头像/笔记媒体）默认 /data/baiflow，改 .env 的 BAIFLOW_DATA_DIR。

services:
  server:
    # 命名空间与版本都走 .env（由 release.yml 部署时写入），仓库里不留账号名
    image: ${BAIFLOW_IMAGE_NAMESPACE:-ghcr.io/your-account}/baiflow-server:${BAIFLOW_IMAGE_TAG:-latest}
    container_name: baiflow-server
    restart: unless-stopped
    network_mode: host
    environment:
      BAIFLOW_DB_URL: jdbc:mysql://${MYSQL_HOST:-127.0.0.1}:${MYSQL_PORT:-3306}/${MYSQL_DATABASE:-baiflow}?connectionTimeZone=Asia/Shanghai&forceConnectionTimeZoneToSession=true
      BAIFLOW_DB_USERNAME: ${MYSQL_USER:-root}
      BAIFLOW_DB_PASSWORD: ${MYSQL_PASSWORD:?请在 deploy/.env 设置 MYSQL_PASSWORD}
      BAIFLOW_REDIS_HOST: ${REDIS_HOST:-127.0.0.1}
      BAIFLOW_REDIS_PORT: ${REDIS_PORT:-6379}
      BAIFLOW_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      BAIFLOW_STORAGE_ROOT: /data/baiflow/files
      BAIFLOW_AVATAR_PATH: /data/baiflow/avatars
      BAIFLOW_NOTE_MEDIA_PATH: /data/baiflow/notes-media
      # 首次初始化令牌落盘位置（数据目录下，与 files/ 平级，不暴露给文件接口）
      BAIFLOW_SETUP_TOKEN_PATH: ${BAIFLOW_DATA_DIR:-/data/baiflow}/setup-token.txt
    volumes:
      - ${BAIFLOW_DATA_DIR:-/data/baiflow}:/data/baiflow

  web:
    image: ${BAIFLOW_IMAGE_NAMESPACE:-ghcr.io/your-account}/baiflow-web:${BAIFLOW_IMAGE_TAG:-latest}
    container_name: baiflow-web
    restart: unless-stopped
    network_mode: host
    depends_on:
      - server
    volumes:
      - ${BAIFLOW_DATA_DIR:-/data/baiflow}:/data/baiflow
