# BaiFlow Nginx — 本地测试环境
# 用法：
#   1. sudo apt install nginx
#   2. 将主 nginx.conf 的 user 改为当前用户避免权限问题：
#      sudo sed -i 's/^user .*/user lxb;/' /etc/nginx/nginx.conf
#   3. 将此文件软链：
#      sudo ln -s /home/lxb/workspace/AI/BaiFlow/deploy/nginx.conf /etc/nginx/sites-enabled/baiflow
#   4. sudo rm /etc/nginx/sites-enabled/default
#   5. sudo nginx -t && sudo nginx -s reload
#   6. 访问 http://<服务器IP>:8088

server {
    listen 8088;
    server_name _;   # 响应所有域名/IP

    client_max_body_size 2048m;

    # ---- 前端静态资源（Vite build 产物） ----
    root /home/lxb/workspace/AI/BaiFlow/baiflow-web/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- API 反代到 Spring Boot ----
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Range 请求透传（视频 seek / PDF 部分加载 / 图片预览）
        proxy_set_header Range $http_range;

        # 关闭缓冲（大文件流式传输，视频不卡顿）
        proxy_buffering off;

        # 超时放宽（长时间播放不中断）
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        gzip off;
    }

    # ---- 头像（Nginx 直接 serve，不经后端） ----
    location /avatars/ {
        alias /home/lxb/baiflow-data/avatars/;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }
}
