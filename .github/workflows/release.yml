# BaiFlow — 发布（构建镜像 → 推送 GHCR → 部署服务器）
#
# 触发：推 v* tag（如 v1.2.3）；workflow_dispatch 只重建镜像、不部署
# 做什么：
#   1. images：并行构建 server / web 两个镜像，推送到 GHCR
#      每个镜像打三个 tag：v1.2.3（版本号）、sha-<短哈希>、latest（仅 tag 触发时）
#   2. deploy：SSH 登服务器 → git pull 取最新 compose → 把版本号写进 .env →
#      docker compose pull && up -d → curl /api/health 健康检查
#
# 需要的仓库 Secret（Settings → Secrets and variables → Actions）：
#   DEPLOY_HOST    服务器地址（GitHub runner 能 SSH 到达）
#   DEPLOY_USER    SSH 用户
#   DEPLOY_SSH_KEY 该用户的 SSH 私钥（OpenSSH 格式，ed25519）
#   DEPLOY_PATH    服务器上仓库 clone 的绝对路径（内含 deploy/ 目录）
#
# 镜像公开可拉（GHCR 包首次推送后需手动设为 Public），服务器无需 docker login。
# 具体见 deploy/SKILL.md 的「首次上线」清单。
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# 部署不允许并发，也不取消正在进行的（避免半截状态）
concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  images:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            context: baiflow-server
          - name: web
            context: baiflow-web
    steps:
      - uses: actions/checkout@v4

      # 镜像命名空间取自仓库 owner（镜像路径必须小写），改名/转移仓库时自动跟随，
      # 不在仓库里写死账号名
      - name: 计算镜像命名空间
        id: ns
        run: echo "namespace=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.ns.outputs.namespace }}/baiflow-${{ matrix.name }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: 部署到服务器
    needs: images
    # 只认「push 出来的 tag」：手动 workflow_dispatch 即使选了某个 tag ref 也只重建镜像、不上生产
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: 计算镜像命名空间
        id: ns
        run: echo "namespace=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: 准备 SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: 拉取新镜像并重启
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            bash -s <<'REMOTE'
          set -euo pipefail

          cd "${{ secrets.DEPLOY_PATH }}"
          git pull --ff-only

          cd deploy
          # 把本次发布信息写进 .env（首次没有该键则追加），供 compose 的 ${BAIFLOW_IMAGE_*} 取用
          set_env() {
            if grep -q "^$1=" .env; then
              sed -i "s|^$1=.*|$1=$2|" .env
            else
              echo "$1=$2" >> .env
            fi
          }
          set_env BAIFLOW_IMAGE_NAMESPACE '${{ steps.ns.outputs.namespace }}'
          set_env BAIFLOW_IMAGE_TAG '${{ github.ref_name }}'

          docker compose pull
          docker compose up -d
          docker compose ps
          REMOTE

      - name: 部署后健康检查
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            bash -s <<'REMOTE'
          set -uo pipefail

          # /api/health 公开无需认证，且会探数据库连通性
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8088/api/health >/dev/null 2>&1; then
              echo "健康检查通过（第 ${i} 次探测）"
              curl -sS http://127.0.0.1:8088/api/health
              exit 0
            fi
            sleep 5
          done

          echo "健康检查失败：150 秒内 /api/health 未就绪"
          cd "${{ secrets.DEPLOY_PATH }}/deploy"
          docker compose ps
          docker compose logs --tail=200 server
          exit 1
          REMOTE
