spring:
  application:
    name: baiflow-server
  profiles:
    active: dev
  messages:
    basename: i18n/messages
    encoding: UTF-8
    default-locale: zh_CN
  datasource:
    url: ${BAIFLOW_DB_URL:jdbc:mysql://127.0.0.1:3306/baiflow?connectionTimeZone=Asia/Shanghai&forceConnectionTimeZoneToSession=true}
    username: ${BAIFLOW_DB_USERNAME:root}
    password: ${BAIFLOW_DB_PASSWORD:change-me}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${BAIFLOW_REDIS_HOST:127.0.0.1}
      port: ${BAIFLOW_REDIS_PORT:6379}
      password: ${BAIFLOW_REDIS_PASSWORD:}
      database: ${BAIFLOW_REDIS_DATABASE:0}
  flyway:
    enabled: true
    locations: classpath:db
    baseline-on-migrate: true
    baseline-version: 1
    clean-disabled: true
    out-of-order: false
    validate-on-migrate: false
    encoding: UTF-8
    placeholder-replacement: false
  jackson:
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: ${BAIFLOW_UPLOAD_MAX_SIZE:2GB}
      max-request-size: ${BAIFLOW_UPLOAD_MAX_SIZE:2GB}
  task:
    scheduling:
      pool:
        size: 4
    execution:
      pool:
        core-size: 2
        max-size: 4

server:
  port: ${BAIFLOW_SERVER_PORT:8080}

mybatis-plus:
  mapper-locations: classpath:com/baiflow/**/mapper/xml/**/*.xml
  type-enums-package: com.baiflow
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  level:
    root: INFO
    com.baiflow: INFO

baiflow:
  auth-session:
    web-hours: ${BAIFLOW_AUTH_WEB_HOURS:2}
    android-days: ${BAIFLOW_AUTH_ANDROID_DAYS:180}
  init-admin:
    username: ${BAIFLOW_INIT_ADMIN_USERNAME:admin}
    password: ${BAIFLOW_INIT_ADMIN_PASSWORD:admin}
  storage:
    default-root-path: ${BAIFLOW_STORAGE_ROOT:/home/lxb/baiflow-data/files}
    avatar-path: ${BAIFLOW_AVATAR_PATH:/home/lxb/baiflow-data/avatars}
    note-media-path: ${BAIFLOW_NOTE_MEDIA_PATH:/home/lxb/baiflow-data/notes-media}
