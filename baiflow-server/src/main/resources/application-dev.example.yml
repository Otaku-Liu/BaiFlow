spring:
  datasource:
    url: jdbc:mysql://example-host:3306/example-db
    username: example-user
    password: example-password
  data:
    redis:
      host: example-host
      port: 16379
      password: example-password
      database: 0

baiflow:
  auth-session:
    web-hours: 2
    android-days: 180
  storage:
    # 改成你本机的实际路径（真实路径不要提交）
    default-root-path: /path/to/baiflow-data/files
    avatar-path: /path/to/baiflow-data/avatars
