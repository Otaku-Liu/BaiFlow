# BaiFlow i18n — English

OK=Operation successful
UNAUTHORIZED=Not logged in or token invalid, please log in again
FORBIDDEN=Insufficient privileges
VALIDATION_ERROR=Request parameter validation failed
NOT_FOUND=Resource not found
FILE_OPERATION_FAILED=File operation failed
STORAGE_ROOT_OFFLINE=Storage root unavailable
DOWNLOAD_ENGINE_ERROR=Download engine error
SHARE_LINK_INVALID=Share link invalid
SHARE_LINK_EXPIRED=Share link expired
SHARE_LIMIT_EXCEEDED=Share access or download limit exceeded
EXTRACTION_CODE_REQUIRED=Extraction code required
EXTRACTION_CODE_INVALID=Extraction code incorrect
PRIVATE_PASSWORD_REQUIRED=Private folder password required
PRIVATE_PASSWORD_INVALID=Private folder password incorrect
INTERNAL_ERROR=Internal server error, please try again later
USERNAME_EXISTS=Username already exists
ACCOUNT_DISABLED=Account disabled
ACCOUNT_LOCKED=Account locked
INVALID_CREDENTIALS=Invalid username or password

# Common
access_denied=Insufficient privileges
validation_failed=Validation failed
unexpected_error=Internal server error, please try again later
