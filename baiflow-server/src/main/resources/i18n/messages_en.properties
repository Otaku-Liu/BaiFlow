不允许删除系统内置管理员账号=Cannot delete the built-in system administrator account
不允许禁用或启用管理员账号=Cannot disable or enable an administrator account
不允许手动锁定用户，仅支持禁用或恢复=Manual locking is not supported. Only disable or restore is allowed
不支持的媒体格式=Unsupported media format
不支持的媒体格式，仅支持图片（png/jpeg/webp/gif）与音频=Unsupported media format. Only images (png/jpeg/webp/gif) and audio are supported
